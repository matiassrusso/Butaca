name: CI

# Existe por un caso concreto (2026-07-31): un commit rompio el build de
# TypeScript, Vercel fallo el deploy en silencio, y durante un dia entero se
# creyo que una feature nueva estaba en produccion cuando en realidad seguia
# corriendo la version anterior. Nada bloqueaba pushear codigo que no compila.
#
# Ojo con el frontend: `tsc --noEmit` NO sirve para verificar este repo
# (frontend/tsconfig.json tiene "files": [] y solo "references", asi que no
# chequea ningun archivo y sale 0 siempre). El unico comando que verifica de
# verdad es `npm run build`, que corre `tsc -b`.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # 3.12 y 3.14 a proposito (2026-09-09): 3.14 evalua las anotaciones de
    # forma diferida (PEP 649), asi que un nombre usado solo en una anotacion
    # y nunca importado pasa local (3.14) y explota en import con 3.12/3.13.
    # Paso una vez con `Recommendation` en llm_client.py: CI rota 6 pushes
    # seguidos sin que nadie lo viera, y prod (Render, >=3.14) andaba igual.
    # 3.12 atrapa eso; 3.14 testea lo que corre prod.
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest httpx
      # desde la raiz, no desde backend/: los tests importan
      # `backend.app.*`, asi que correrlos desde backend/ falla la coleccion
      # entera con ModuleNotFoundError y parece que no hubiera tests
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
